[package]
name = "saqlain-code"
version = "0.1.0"
edition = "2021"
description = "A terminal-based AI coding agent with real tool execution, backed by an OpenAI-compatible local API server."
license = "MIT"
authors = ["Saqlain Khan"]

[[bin]]
name = "saqlain-code"
path = "src/main.rs"

[lib]
name = "saqlain_code"
path = "src/lib.rs"

[dependencies]
tokio = { version = "=1.35.1", features = ["full"] }
reqwest = { version = "=0.11.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.195", features = ["derive"] }
serde_json = "=1.0.111"
clap = { version = "=4.4.18", features = ["derive", "env"] }
crossterm = "=0.27.0"
walkdir = "=2.4.0"
globset = "=0.4.14"
similar = "=2.4.0"
anyhow = "=1.0.79"
thiserror = "=1.0.56"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter"] }
uuid = { version = "=1.7.0", features = ["v4"] }
dirs = "=5.0.1"
dotenvy = "=0.15.7"
toml = "=0.8.9"

[dev-dependencies]
tempfile = "=3.9.0"

# Pin transitive dependencies that in newer releases require the
# unstable `edition2024` Cargo feature, which is unavailable on the
# Rust/Cargo 1.75 toolchain used to build this project.
[dependencies.indexmap]
version = "=2.2.6"

[dependencies.hashbrown]
version = "=0.14.3"

[dependencies.base64]
version = "=0.21.7"

[dependencies.winnow]
version = "=0.5.40"

[dependencies.idna]
version = "=0.5.0"

[dependencies.litemap]
version = "=0.7.3"

[dependencies.zerofrom]
version = "=0.1.4"

[dependencies.icu_normalizer]
version = "=1.5.0"

[dependencies.icu_properties]
version = "=1.5.1"

[dependencies.tinystr]
version = "=0.7.6"

[dependencies.writeable]
version = "=0.5.5"

[dependencies.yoke]
version = "=0.7.4"

[dependencies.zerovec]
version = "=0.10.4"

[dependencies.zerocopy]
version = "=0.7.35"

[dependencies.tokio-util]
version = "=0.7.10"

[dependencies.socket2]
version = "=0.5.5"

[dependencies.url]
version = "=2.5.0"

[dependencies.ring]
version = "=0.17.8"

[dependencies.rustls]
version = "=0.21.10"

[dependencies.rustls-webpki]
version = "=0.101.7"

[profile.release]
opt-level = 3
lto = true
